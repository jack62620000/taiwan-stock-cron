name: 美股收盤資料

# 寫入 ETF 專用的 Supabase 專案（secrets：ETF_SUPABASE_URL、ETF_SUPABASE_KEY），給每日早上 8:00 的簡報用
on:
  schedule:
    # 週二～週六台灣時間清晨 5:10、6:40 各跑一次（UTC 週一～週五 21:10、22:40）- 美股收盤後、7:53 簡報前
    # GitHub 排程常延誤（10/30 的 6:20 排程晚了 3.5 小時才跑），跑兩次比較保險；資料是 upsert，重複跑不會重複寫入
    # 美國財政部殖利率約美東下午才公布，第一次可能還抓不到當天美債，第二次會補上
    - cron: '10 21 * * 1-5'
    - cron: '40 22 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '試跑：只下載與解析，不寫入資料庫'
        type: boolean
        default: false

jobs:
  us-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch US market close
        env:
          ETF_SUPABASE_URL: ${{ secrets.ETF_SUPABASE_URL }}
          ETF_SUPABASE_KEY: ${{ secrets.ETF_SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONUNBUFFERED: '1'
        run: python fetch_us_market.py
