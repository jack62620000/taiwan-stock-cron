name: 區間回補
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日期（YYYY-MM-DD）'
        required: true
        type: string
      end_date:
        description: '結束日期（YYYY-MM-DD，留空為今天）'
        required: false
        type: string
        default: ''
      datasets:
        description: '要回補的資料（prices=股價、ins=三大法人、margin=融資融券、adjust=還原權值事件、holder=千張大戶、revenue=月營收、quarterly=季報、futures=期貨三大法人、index=大盤指數、foreign=外資持股、cashflow=現金流量）'
        required: true
        type: choice
        default: 'ins,margin'
        options:
          - 'ins,margin'
          - 'prices'
          - 'prices,ins,margin'
          - 'ins'
          - 'margin'
          - 'adjust'
          - 'holder'
          - 'revenue'
          - 'quarterly'
          - 'futures'
          - 'index'
          - 'foreign'
          - 'cashflow'

# 同一時間只允許一個回補在跑，避免請求頻率加倍
concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          DATASETS: ${{ github.event.inputs.datasets }}
        run: python -u backfill.py
