name: 暫時測試期交所網址
on:
  pull_request:
    paths: ['probe_taifex.py', '.github/workflows/probe_taifex.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests && python probe_taifex.py
