name: 還原權值資料來源測試
# 只抓資料、印出結果，不寫入資料庫
on:
  push:
    branches: [claude/project-thread-3bhtks]
    paths: [fetch_adjustments.py, .github/workflows/test_adjust_sources.yml]
  workflow_dispatch:

jobs:
  test-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Dry run
        env:
          DRY_RUN: '1'
          START_DATE: '2025-09-01'
          END_DATE: '2026-10-15'
        run: python -u fetch_adjustments.py
