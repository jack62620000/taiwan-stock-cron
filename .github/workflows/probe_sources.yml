name: 暫時：找資料來源
on:
  push:
    branches: [claude/project-thread-cercx1]
    paths: ['probe/**', '.github/workflows/probe_sources.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python probe/probe_sources.py
