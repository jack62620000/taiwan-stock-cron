name: 暫時測試
on:
  push:
    branches: [claude/project-thread-3bhtks]
    paths: [.github/workflows/tmp_check.yml, auto_fetch_holder.py]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u auto_fetch_holder.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
