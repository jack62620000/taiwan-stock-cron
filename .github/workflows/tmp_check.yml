name: 暫時檢查
on:
  push:
    branches: [claude/project-thread-3bhtks]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 大盤指數試跑（不寫入）
        run: |
          DRY_RUN=1 START_DATE=2024-01-01 END_DATE=2024-01-31 python fetch_market_index.py
          DRY_RUN=1 START_DATE=2026-10-01 END_DATE=2026-10-18 python fetch_market_index.py
