name: 暫時檢查
on:
  push:
    branches: [claude/project-thread-3bhtks]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 一次性：補 2026Q1 缺的損益與資產負債欄位（只寫空欄位，EPS、淨值、P/B、出表日期不動）
        run: |
          python - <<'PY'
          import fetch_stock_info as f
          import fetch_quarterly_history as h
          FILL = ["revenue", "gross_profit", "operating_income", "gross_margin", "operating_margin",
                  *f.INCOME_EXTRA, *f.BALANCE_EXTRA, "debt_ratio", "current_ratio"]
          db, start = {}, 0
          while True:
              res = f.supabase.table("quarterly_report").select("stock_id, eps, book_value").eq("year", 2026).eq("quarter", 1) \
                  .order("stock_id").range(start, start + 999).execute()
              db.update({r["stock_id"]: r for r in res.data})
              if len(res.data) < 1000: break
              start += 1000
          parts, problems = h.fetch_quarter(2026, 1, f.get_valid_stock_ids())
          print("資料庫", len(db), "筆；觀測站", len(parts), "筆；問題", problems)
          eps_diff = bv_diff = 0
          payload = []
          for sid, inc, bal in parts:
              if sid not in db: continue
              rec = f.build_quarterly_record(sid, inc, bal, None)
              d = db[sid]
              if d["eps"] is not None and rec["eps"] is not None and abs(float(d["eps"]) - rec["eps"]) > 0.005:
                  eps_diff += 1
                  if eps_diff <= 5: print("  EPS 不同", sid, d["eps"], rec["eps"])
              if d["book_value"] is not None and rec["book_value"] is not None and abs(float(d["book_value"]) - rec["book_value"]) > 0.005:
                  bv_diff += 1
                  if bv_diff <= 5: print("  淨值不同", sid, d["book_value"], rec["book_value"])
              payload.append({"stock_id": sid, "year": 2026, "quarter": 1, **{k: rec[k] for k in FILL}})
          print("可對應", len(payload), "筆；EPS 不同", eps_diff, "；淨值不同", bv_diff, "；資料庫有但觀測站沒有", len(set(db) - {p[0] for p in parts}))
          if problems or eps_diff > 20 or len(payload) < 0.95 * len(db):
              raise SystemExit("差異太大或抓取有問題，不寫入")
          print("例", payload[0])
          f.save_data_batches("quarterly_report", payload)
          PY
