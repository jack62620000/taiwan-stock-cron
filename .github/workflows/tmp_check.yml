name: 暫時驗證
on:
  push:
    branches: [claude/project-thread-3bhtks]
    paths: [tmp_probe.py, .github/workflows/tmp_check.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -u tmp_probe.py
