name: 暫時檢查
on:
  push:
    branches: [claude/project-thread-3bhtks]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 查期交所期貨三大法人歷史下載格式
        run: |
          for r in "2026/04/01 2026/04/02" "2024/01/02 2024/01/03" "2024/01/01 2025/12/31"; do
            set -- $r
            echo "===== $1 ~ $2 ====="
            curl -sS -m 90 -A "Mozilla/5.0" -X POST "https://www.taifex.com.tw/cht/3/futContractsDateDown" \
              --data-urlencode "queryStartDate=$1" --data-urlencode "queryEndDate=$2" --data-urlencode "commodityId=TXF" \
              -o out.csv -w "HTTP %{http_code} 大小 %{size_download}\n"
            file out.csv
            iconv -f big5 -t utf-8 out.csv 2>/dev/null | head -8 || head -c 600 out.csv
            iconv -f big5 -t utf-8 out.csv 2>/dev/null | wc -l
            sleep 5
          done
