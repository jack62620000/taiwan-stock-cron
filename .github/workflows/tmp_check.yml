name: 暫時檢查
on:
  push:
    branches: [claude/project-thread-3bhtks]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 歷史季報試跑（不寫入）
        run: |
          DRY_RUN=1 START_DATE=2024-03-01 END_DATE=2024-03-31 python fetch_quarterly_history.py
          DRY_RUN=1 START_DATE=2025-12-01 END_DATE=2025-12-31 python fetch_quarterly_history.py
