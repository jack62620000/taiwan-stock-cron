name: 暫時檢查
on:
  push:
    branches: [claude/project-thread-3bhtks]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 現金流量試跑（不寫入）
        run: DRY_RUN=1 START_DATE=2024-03-31 END_DATE=2024-03-31 python fetch_cashflow_history.py
