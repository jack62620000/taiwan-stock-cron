name: 早報備援

# 早上 8:30 還沒有今天的早報（Claude 排程沒跑或失敗），用資料庫數字自動排一份簡易版給 LINE（brief_fallback.py）。
# 有產生簡易版時這次會標成失敗、GitHub 寄信，當天就知道完整早報沒出來；已經有今天的早報就什麼都不做。
on:
  schedule:
    # 週一～六台灣時間 08:35（UTC 00:35）。平常由資料庫的 pg_cron 準時觸發（sql/github_dispatch.sql 的 gh-brief-fallback），
    # 這裡是備援：GitHub 自己的排程常晚一些才跑，那時已經有今天的早報就會直接略過
    - cron: '35 0 * * 1-6'
  workflow_dispatch:
    inputs:
      force:
        description: '不管今天有沒有早報都產生簡易版（測試用，會蓋掉今天的完整早報）'
        type: boolean
        default: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Build fallback brief if today's is missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ETF_SUPABASE_URL: ${{ secrets.ETF_SUPABASE_URL }}
          ETF_SUPABASE_KEY: ${{ secrets.ETF_SUPABASE_KEY }}
          LINE_WATCH_OWNER: ${{ secrets.LINE_WATCH_OWNER }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python -u brief_fallback.py
