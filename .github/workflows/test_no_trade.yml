name: 測試停牌處理（暫時）
on:
  push:
    branches: [claude/project-thread-3bhtks]
    paths: [test_no_trade.py, app/**, .github/workflows/test_no_trade.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u test_no_trade.py
