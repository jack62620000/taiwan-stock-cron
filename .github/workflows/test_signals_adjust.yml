name: 測試評分還原股價（暫時）
on:
  push:
    branches: [claude/project-thread-3bhtks]
    paths: [test_signals_adjust.py, signals.py, .github/workflows/test_signals_adjust.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u test_signals_adjust.py
