name: probe line lists (temporary)
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: main
          path: base
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: compare pages (main vs PR) on real data
        run: |
          python .github/probe/cmp.py base > base.json
          python .github/probe/cmp.py . > new.json
          python -c "
          import json;b=json.load(open('base.json'));n=json.load(open('new.json'))
          for k in n: print(k, 'SAME' if b.get(k)==n[k] else 'DIFF', [len(x) if isinstance(x,str) else x for x in n[k]][:8])
          assert b==n
          "
      - name: dry run lists
        run: |
          python - <<'PY'
          import json, time
          t=time.time()
          import line_lists
          out=line_lists.build_lists()
          print(f"{time.time()-t:.0f} 秒")
          for k,v in out.items():
              print(k, v['date'], len(v['messages']), 'msgs', f"{len(json.dumps(v,ensure_ascii=False).encode()):,} bytes")
              print(v['messages'][0]['text'])
              for m in v['messages'][1:]:
                  c=m['contents']['contents']; print(' carousel', len(c), f"{len(json.dumps(m['contents'],ensure_ascii=False).encode()):,}B", [b['header']['contents'][1]['text'] for b in c][:12])
          PY
