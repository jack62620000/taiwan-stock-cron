name: 每日台股資料同步
on:
  schedule:
    # 平日（週一到五）台灣時間晚上9:08（UTC 13:08）- 期貨專用
    - cron: '08 13 * * 1-5'
    # 隔日台灣時間早上6:30（UTC 22:30）- 期貨補抓，避免晚上那次抓到的還是前一天
    - cron: '30 22 * * 1-5'
    # 平日（週一到五）台灣時間晚上11:11（UTC 15:11）- 股價/法人/融資券
    - cron: '11 15 * * 1-5'
    # 週六台灣時間早上9:06（UTC 01:06）- 大戶持股
    - cron: '06 1 * * 6'
  workflow_dispatch:
    inputs:
      run_holder_only:
        description: '只執行大戶持股（測試用）'
        type: boolean
        default: false
      target_date:
        description: '補抓指定日期的股價/法人/融資券（YYYY-MM-DD，留空為今天）'
        type: string
        default: ''

jobs:
  update-futures:
    if: >-
      github.event.schedule == '08 13 * * 1-5' ||
      github.event.schedule == '30 22 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_holder_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run futures fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python auto_fetch_futures.py

  update-daily-data:
    if: github.event.schedule == '11 15 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_holder_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python auto_fetch.py

  # 每日資料抓完後，幫全市場股票打分數（寫進 daily_signals）
  # 就算抓資料那一步回報不完整（例如少了某個市場），已經抓到的資料仍然可以評分
  update-signals:
    needs: update-daily-data
    if: always() && needs.update-daily-data.result != 'skipped' && needs.update-daily-data.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run signal scoring
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SIGNALS_START: ${{ github.event.inputs.target_date }}
          SIGNALS_END: ${{ github.event.inputs.target_date }}
        run: python signals.py

  update-holder-only:
    if: github.event.schedule == '06 1 * * 6' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_holder_only == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run holder-only fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python auto_fetch_holder.py
