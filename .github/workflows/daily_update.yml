name: 每日台股資料同步
on:
  schedule:
    # 平日（週一到五）台灣時間晚上7:00（UTC 11:00）- 期貨專用
    - cron: '08 14 * * 1-5'
    # 平日（週一到五）台灣時間晚上11:11（UTC 15:11）- 股價/法人/融資券
    - cron: '11 15 * * 1-5'
    # 週六台灣時間早上9:06（UTC 01:06）- 大戶持股
    - cron: '06 1 * * 6'
  workflow_dispatch:
    inputs:
      run_holder_only:
        description: '只執行大戶持股（測試用）'
        type: boolean
        default: false

jobs:
  update-futures:
    if: github.event.schedule == '08 14 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run futures fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python auto_fetch_futures.py

  update-daily-data:
    if: github.event.schedule == '11 15 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_holder_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python auto_fetch.py

  update-holder-only:
    if: github.event.schedule == '06 1 * * 6' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_holder_only == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run holder-only fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python auto_fetch_holder.py
