name: 每日台股資料同步
on:
  schedule:
    # 平日（週一到五）台灣時間晚上9:08（UTC 13:08）- 期貨專用
    - cron: '08 13 * * 1-5'
    # 隔日台灣時間早上6:30（UTC 22:30）- 期貨補抓，同時檢查股價/法人/融資券有沒有缺，缺了就補
    - cron: '30 22 * * 1-5'
    # 平日（週一到五）台灣時間晚上11:11（UTC 15:11）- 股價/法人/融資券
    - cron: '11 15 * * 1-5'
    # 週六台灣時間早上9:06（UTC 01:06）- 大戶持股
    - cron: '06 1 * * 6'
  workflow_dispatch:
    inputs:
      run_holder_only:
        description: '只執行大戶持股（測試用）'
        type: boolean
        default: false
      target_date:
        description: '補抓指定日期的股價/法人/融資券（YYYY-MM-DD，留空為今天）'
        type: string
        default: ''

jobs:
  update-futures:
    if: >-
      github.event.schedule == '08 13 * * 1-5' ||
      github.event.schedule == '30 22 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_holder_only != 'true')
    runs-on: ubuntu-latest
    # 每次最多 60 分鐘、逾時重跑一次（.github/scripts/retry_on_timeout.sh），整個工作最多 130 分鐘
    timeout-minutes: 130
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run futures fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: .github/scripts/retry_on_timeout.sh python auto_fetch_futures.py

  # 晚上 11:11 抓當天；早上 6:30 再檢查一次，晚上那次延遲、失敗或沒跑的日子會補上
  update-daily-data:
    if: >-
      github.event.schedule == '11 15 * * 1-5' ||
      github.event.schedule == '30 22 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_holder_only != 'true')
    runs-on: ubuntu-latest
    # 每次最多 60 分鐘、逾時重跑一次（.github/scripts/retry_on_timeout.sh），整個工作最多 130 分鐘
    timeout-minutes: 130
    # 晚上那次拖到早上才跑時，兩次不要同時抓
    concurrency:
      group: daily-data
      cancel-in-progress: false
    outputs:
      fetched: ${{ steps.fetch.outputs.fetched }}
      start: ${{ steps.fetch.outputs.start }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily fetch script
        id: fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: .github/scripts/retry_on_timeout.sh python auto_fetch.py

  # 每日資料抓完後，幫全市場股票打分數（寫進 daily_signals）
  # 就算抓資料那一步回報不完整（例如少了某個市場），已經抓到的資料仍然可以評分
  # 這次沒有抓到任何新的交易日（fetched=0，例如早上檢查時資料早已存齊）就不重算
  update-signals:
    needs: update-daily-data
    if: >-
      always() && needs.update-daily-data.result != 'skipped' && needs.update-daily-data.result != 'cancelled' &&
      needs.update-daily-data.outputs.fetched != '0'
    concurrency:
      group: daily-signals
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run signal scoring
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 從這次補抓的第一天開始評分到最新交易日（手動指定日期時只評那天）
          SIGNALS_START: ${{ github.event.inputs.target_date || needs.update-daily-data.outputs.start }}
          SIGNALS_END: ${{ github.event.inputs.target_date }}
        run: python signals.py
      # 動能選股：趨勢模板、52 週新高突破（寫進 momentum_signals）
      - name: Run momentum screening
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MOMENTUM_START: ${{ github.event.inputs.target_date || needs.update-daily-data.outputs.start }}
          MOMENTUM_END: ${{ github.event.inputs.target_date }}
        run: python momentum.py
      # LINE 打字查詢用的分析卡：全部股票的卡片算好存到 Storage（archive 桶 _line_cards/，每天覆蓋，不佔資料庫）
      - name: Record rule-based paper trades
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AUTO_PAPER_GROUP_ID: '11'   # 照明日買進規則自動記錄到這個模擬持股分組（每日買進測試）
        run: python auto_paper.py
      - name: Build LINE lookup cards
        id: cards
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python line_cards.py
      # 評分完再清除超過保留期限的舊資料（期限見 cleanup_old_data.py）
      - name: Clean up expired data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cleanup_old_data.py
      # 最後檢查最近幾天每張表的筆數，少於平常九成就讓這次排程顯示失敗（前面步驟失敗也照樣檢查）
      - name: Check data counts
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python check_data.py
      - name: Report LINE lookup cards failure
        if: always() && steps.cards.outcome == 'failure'
        run: |
          echo "::error title=LINE 查詢卡片更新失敗::LINE 打字查詢會回覆前一天的卡片，請看 Build LINE lookup cards 這一步的紀錄"
          exit 1

  # 早上 6:30 沒有補到資料（不會重新評分）時，檢查 LINE 查詢卡片是不是最新的，
  # 前一晚產生卡片那一步失敗過的話在這裡補上；卡片已是最新就什麼都不做
  # （自選股不再每晚推播：在 LINE 打「自選」隨時查；要推播時手動執行「LINE 自選股推播（手動）」）
  refresh-line-cards:
    needs: [update-daily-data, update-signals]
    if: always() && github.event.schedule == '30 22 * * 1-5' && needs.update-signals.result == 'skipped'
    concurrency:
      group: daily-signals
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild LINE lookup cards if outdated
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LINE_CARDS_IF_STALE: "1"
        run: python line_cards.py

  update-holder-only:
    if: github.event.schedule == '06 1 * * 6' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_holder_only == 'true')
    runs-on: ubuntu-latest
    # 每次最多 60 分鐘、逾時重跑一次（.github/scripts/retry_on_timeout.sh），整個工作最多 130 分鐘
    timeout-minutes: 130
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run holder-only fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: .github/scripts/retry_on_timeout.sh python auto_fetch_holder.py
