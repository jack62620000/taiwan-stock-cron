# 暫時：在分支上試跑 ETF 抓取（不寫資料庫），開 PR 前刪除
name: ETF 試跑（暫時）
on:
  push:
    branches: [claude/project-thread-ewuvx1]
    paths: [etf_fetch.py, etf_update.py, .github/workflows/etf_dryrun.yml]
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETF_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: backfill holder and dividends
        run: ETF_JOB=backfill BACKFILL_START=2026-10-16 BACKFILL_END=2026-10-17 DATASETS=holder,dividends python -u etf_update.py || true
      - name: dividends from 2005
        run: ETF_JOB=backfill BACKFILL_START=2005-01-01 BACKFILL_END=2008-12-31 DATASETS=dividends python -u etf_update.py || true
