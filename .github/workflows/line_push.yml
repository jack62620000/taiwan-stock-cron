name: LINE 自選股推播（手動）
# 設定好 LINE 金鑰後，用這個手動推一次測試、或重新產生 LINE 查詢卡片；
# 平常每晚的推播和查詢卡片在「每日台股資料同步」評分完之後自動執行
on:
  workflow_dispatch:
    inputs:
      force:
        description: '今天已經推過也再推一次'
        type: boolean
        default: true
      push:
        description: '推播自選股分析'
        type: boolean
        default: true
      cards:
        description: '重新產生 LINE 打字查詢用的分析卡'
        type: boolean
        default: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Push watchlist analysis to LINE
        if: github.event.inputs.push == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_WATCH_OWNER: ${{ secrets.LINE_WATCH_OWNER }}
          LINE_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python line_push.py
      - name: Build LINE lookup cards
        if: github.event.inputs.cards == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python line_cards.py
